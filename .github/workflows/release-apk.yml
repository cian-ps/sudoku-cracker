name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.3"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap OCR models
        run: uv run python scripts/bootstrap_ocr_models.py

      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: .buildozer-cache
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      - name: Prepare Buildozer cache directory
        run: mkdir -p .buildozer-cache && chmod -R ugo+rwX .buildozer-cache

      - name: Build with Buildozer
        run: |
          docker run --rm \
            --shm-size=2g \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.buildozer-cache:/home/user/.buildozer" \
            --entrypoint bash \
            ghcr.io/kivy/buildozer:latest \
            -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y protobuf-compiler && exec /usr/local/bin/entrypoint.sh -v android debug"

      - name: Verify APK output
        run: |
          ls -la bin/*.apk
          test -n "$(ls bin/*.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudokucracker-apk
          path: bin/*.apk
          retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sudokucracker-apk
          path: artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sudoku Cracker ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') || contains(env.RELEASE_TAG, 'alpha') }}
          generate_release_notes: true
          overwrite_files: true
          files: artifact/**
