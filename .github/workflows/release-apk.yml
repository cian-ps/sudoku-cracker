name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12.3"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Bootstrap OCR models
        run: uv run python scripts/bootstrap_ocr_models.py

      # Cache SDK/NDK/packages under .buildozer. Stale p4a install venvs are
      # stripped before/after build — a corrupted build/venv previously failed
      # with BuildDependencyInstallError while installing pyyaml and friends.
      - name: Cache Buildozer downloads
        uses: actions/cache@v4
        with:
          path: .buildozer-cache
          key: buildozer-v2-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-v2-${{ runner.os }}-
            buildozer-${{ runner.os }}-

      - name: Prepare Buildozer cache directory
        run: |
          mkdir -p .buildozer-cache
          # Drop cached p4a package-install venvs; p4a reuses them and a
          # half-upgraded pip breaks pure-Python requirement installs.
          rm -rf .buildozer-cache/android/platform/build-*/build/venv
          chmod -R ugo+rwX .buildozer-cache

      - name: Decode release keystore
        run: |
          mkdir -p keys
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > keys/sudokucracker-release.keystore
          chmod 600 keys/sudokucracker-release.keystore

      - name: Build with Buildozer
        env:
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.P4A_RELEASE_KEYSTORE_PASSWD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.P4A_RELEASE_KEYALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.P4A_RELEASE_KEYALIAS_PASSWD }}
        run: |
          docker run --rm \
            --shm-size=2g \
            -v "${{ github.workspace }}:/home/user/hostcwd" \
            -v "${{ github.workspace }}/.buildozer-cache:/home/user/.buildozer" \
            -v "${{ github.workspace }}/keys:/keys:ro" \
            -e P4A_RELEASE_KEYSTORE=/keys/sudokucracker-release.keystore \
            -e P4A_RELEASE_KEYSTORE_PASSWD \
            -e P4A_RELEASE_KEYALIAS \
            -e P4A_RELEASE_KEYALIAS_PASSWD \
            --entrypoint bash \
            ghcr.io/kivy/buildozer:latest \
            -c "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y protobuf-compiler && rm -rf /home/user/.buildozer/android/platform/build-*/build/venv && exec /usr/local/bin/entrypoint.sh -v android release"

      - name: Verify APK output
        run: |
          ls -la bin/*-release.apk
          test -n "$(ls bin/*-release.apk 2>/dev/null)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sudokucracker-apk
          path: bin/*-release.apk
          retention-days: 90

      - name: Remove release keystore
        if: always()
        run: rm -f keys/*.keystore

      - name: Drop install venvs before cache save
        if: always()
        run: rm -rf .buildozer-cache/android/platform/build-*/build/venv

  release:
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: sudokucracker-apk
          path: artifact

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sudoku Cracker ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, 'beta') || contains(env.RELEASE_TAG, 'rc') || contains(env.RELEASE_TAG, 'alpha') }}
          generate_release_notes: true
          overwrite_files: true
          files: artifact/**
